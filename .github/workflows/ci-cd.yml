name: CloudPulse Production CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloudpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend

jobs:
  test:
    name: 1. Automated Unit Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (12 Tests)
        run: |
          cd backend
          pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build

  devsecops-sast-secret:
    name: 2. DevSecOps Quality Gates (SAST, SCA & Secrets)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit SAST Scanner
        run: pip install bandit

      - name: Run Bandit Python SAST Scan
        run: |
          bandit -r backend/app/ -ll || true

      - name: Software Composition Analysis (Trivy FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

  security-scan-containers:
    name: 3. Container Vulnerability Scan (Trivy)
    needs: devsecops-sast-secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Local Images for Scanning
        run: |
          docker build -t local/cloudpulse-backend:${{ github.sha }} ./backend
          docker build -t local/cloudpulse-frontend:${{ github.sha }} ./frontend

      - name: Scan Backend Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/cloudpulse-backend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Scan Frontend Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/cloudpulse-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  build-and-publish:
    name: 4. Build & Push Images to GHCR
    needs: security-scan-containers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  lint-and-validate-helm:
    name: 5. Validate Helm Chart & Kubernetes Schemas
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/cloudpulse

      - name: Template Hydration Test
        run: |
          helm template cloudpulse helm/cloudpulse --namespace cloudpulse -f helm/cloudpulse/values-prod.yaml > /dev/null

  deploy-kubernetes:
    name: 6. Kubernetes Deployment & GitOps Sync
    needs: lint-and-validate-helm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Dry-run Deployment Verification
        run: |
          echo "Simulating production Kubernetes deployment verification..."
          helm template cloudpulse helm/cloudpulse --namespace cloudpulse -f helm/cloudpulse/values-prod.yaml
          echo "Deployment validation succeeded. Ready for ArgoCD continuous reconciliation."
