apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-frontend
  namespace: cloudpulse
  labels:
    app: cloudpulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse-frontend
  template:
    metadata:
      labels:
        app: cloudpulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/soleilbrulant/cloudpulse-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-frontend
  namespace: cloudpulse
  labels:
    app: cloudpulse-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: cloudpulse-frontend
