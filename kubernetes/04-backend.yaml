apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-backend
  namespace: cloudpulse
  labels:
    app: cloudpulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse-backend
  template:
    metadata:
      labels:
        app: cloudpulse-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/soleilbrulant/cloudpulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cloudpulse-config
            - secretRef:
                name: cloudpulse-secret
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-backend
  namespace: cloudpulse
  labels:
    app: cloudpulse-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: cloudpulse-backend
