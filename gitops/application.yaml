apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudpulse-project
  source:
    repoURL: 'https://github.com/soleilbrulant/cloudpulse-devops-capstone.git'
    targetRevision: main
    path: helm/cloudpulse
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloudpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
