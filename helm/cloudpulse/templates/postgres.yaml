apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cloudpulse.fullname" . }}-postgres
spec:
  serviceName: "{{ include "cloudpulse.fullname" . }}-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloudpulse.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "cloudpulse.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "cloudpulse_admin"
            - name: POSTGRES_PASSWORD
              value: "cloudpulse_secure_pass_2026"
            - name: POSTGRES_DB
              value: "cloudpulse_db"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.fullname" . }}-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ include "cloudpulse.fullname" . }}-postgres
