apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.fullname" . }}-frontend
  labels:
    app: {{ include "cloudpulse.fullname" . }}-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: {{ .Values.service.frontendPort }}
  selector:
    app: {{ include "cloudpulse.fullname" . }}-frontend
