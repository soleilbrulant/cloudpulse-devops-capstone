services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpulse_admin
      POSTGRES_PASSWORD: cloudpulse_secure_pass_2026
      POSTGRES_DB: cloudpulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse_admin -d cloudpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cloudpulse_admin:cloudpulse_secure_pass_2026@postgres:5432/cloudpulse_db
      APP_NAME: "CloudPulse Infrastructure Management"
      ENVIRONMENT: "development"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      cloudpulse-net:
        aliases:
          - backend-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudpulse-net

volumes:
  pgdata:

networks:
  cloudpulse-net:
    driver: bridge
